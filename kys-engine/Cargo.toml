[package]
name = "kys-engine"
version = "0.1.0"
edition = "2021"
description = "KYS - Karar Yönetim Sistemi: Proje analiz ve araştırma motoru"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF parsing
pdf-extract = "0.7"

# Markdown parsing
pulldown-cmark = "0.11"

# Text processing
regex = "1"
unicode-normalization = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"

# Environment variables
dotenv = "0.15"

# Database (PostgreSQL / Supabase)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# Parallel processing
rayon = "1"

# Rate limiting / retry
tokio-retry = "0.3"
scraper = "0.27.0"
urlencoding = "2.1.3"
