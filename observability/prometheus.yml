global:
  scrape_interval: 30s

rule_files:
  - prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: jury-assistant-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:3000
